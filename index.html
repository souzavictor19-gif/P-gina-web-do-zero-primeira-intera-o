<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: #183c63;
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            border: 5px solid #cf1010;
        }
        main {
            background-color: #FFFFFF;
            color: #03101d;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>
    
    <main>
        <img src="edu.jpeg" alt="Logo em estilo pixel art em um fundo azul-escuro com a palavra EDU TECH">
        
        <h1>Meu primeiro post</h1>
        <p>Por: Victor Delfino</p>
        <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área da tecnologia.</p>
        
        <button>❤️‍🔥 <span>0</span></button>
        <button>​😊​<span>0</span></button>
        
    </main>

    <script>
        const botao = document.querySelector("button");
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent = Number(texto.textContent) + 1;
        }
    </script>
</body>
</html>
